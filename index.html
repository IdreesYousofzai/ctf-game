<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIOBI // BREACH FILE — Case Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0b09;
    --bg-soft: #0f100c;
    --panel: #14140f;
    --panel-alt: #1b1b13;
    --panel-raised: #201f16;
    --border: #33301f;
    --border-soft: #262418;
    --amber: #ffb020;
    --amber-bright: #ffcc66;
    --amber-dim: #8a5f14;
    --amber-faint: #4a3714;
    --cyan: #4fd1e8;
    --cyan-dim: #2a6b78;
    --crimson: #e6423b;
    --crimson-dim: #7a2622;
    --success: #7fd858;
    --success-dim: #3f6b2c;
    --paper: #d9cdae;
    --paper-dim: #9c9276;
    --ink: #0a0b09;
    --mono: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
    --serif: 'Spectral', Georgia, serif;
    --radius: 3px;
  }

  *{ box-sizing: border-box; }
  html, body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--paper);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  ::selection{ background: var(--amber); color: var(--ink); }

  a{ color: var(--cyan); }

  /* subtle scanline / vignette atmosphere */
  body::before{
    content:"";
    position: fixed; inset:0;
    pointer-events:none;
    z-index: 500;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.018) 0px,
      rgba(255,255,255,0.018) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
    opacity: .5;
  }
  body::after{
    content:"";
    position: fixed; inset:0;
    pointer-events:none;
    z-index: 499;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 130%);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  button{ font-family: var(--mono); cursor:pointer; }
  input, textarea{ font-family: var(--mono); }

  /* ---------- BOOT SCREEN ---------- */
  #boot{
    position: fixed; inset:0;
    background: var(--bg);
    z-index: 1000;
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
  }
  #boot-inner{
    width: 100%; max-width: 720px;
    color: var(--amber);
  }
  #boot-lines{
    font-size: 14px;
    line-height: 1.8;
    white-space: pre-wrap;
    min-height: 260px;
  }
  .boot-cursor{
    display:inline-block; width:8px; height:16px;
    background: var(--amber);
    animation: blink 1s steps(1) infinite;
    vertical-align: -2px;
  }
  @keyframes blink{ 50%{ opacity:0; } }
  #boot-enter{
    margin-top: 28px;
    display:none;
  }
  #boot-enter button{
    background: transparent;
    border: 1px solid var(--amber-dim);
    color: var(--amber);
    padding: 12px 22px;
    font-size: 13px;
    letter-spacing: .12em;
    text-transform: uppercase;
    border-radius: var(--radius);
    transition: all .15s ease;
  }
  #boot-enter button:hover{
    background: var(--amber);
    color: var(--ink);
    box-shadow: 0 0 24px rgba(255,176,32,.35);
  }
  #boot-resume{
    margin-top: 14px;
    font-size: 11px;
    color: var(--paper-dim);
  }
  #boot-resume a{ color: var(--cyan); cursor:pointer; text-decoration: underline; }

  /* ---------- APP SHELL ---------- */
  #app{
    display:none;
    min-height: 100vh;
    grid-template-columns: 300px 1fr;
    display:grid;
  }

  #topbar{
    grid-column: 1 / -1;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky; top:0; z-index: 50;
    flex-wrap: wrap;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-size: 13px; letter-spacing:.14em; text-transform:uppercase;
    color: var(--amber);
  }
  .brand .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1;} 50%{ opacity:.35; } }

  .topbar-mid{
    display:flex; align-items:center; gap:22px;
    font-size: 11px; color: var(--paper-dim);
    flex-wrap: wrap;
  }
  .clock{
    color: var(--crimson);
    font-weight:600;
    letter-spacing:.05em;
  }
  .clock b{ color: var(--paper); font-weight:500; }
  .progress-chip{
    color: var(--paper-dim);
  }
  .progress-chip b{ color: var(--amber); }

  .topbar-actions{ display:flex; gap:10px; align-items:center; }
  .btn{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--paper);
    padding: 8px 14px;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    border-radius: var(--radius);
    transition: all .15s ease;
  }
  .btn:hover{ border-color: var(--amber-dim); color: var(--amber); }
  .btn.primary{ border-color: var(--amber-dim); color: var(--amber); }
  .btn.primary:hover{ background: var(--amber); color: var(--ink); }
  .btn:focus-visible, a:focus-visible, input:focus-visible, button:focus-visible{
    outline: 2px solid var(--cyan); outline-offset: 2px;
  }

  /* ---------- SIDEBAR / EVIDENCE BOARD ---------- */
  #sidebar{
    background: var(--bg-soft);
    border-right: 1px solid var(--border);
    padding: 16px 10px 40px;
    overflow-y: auto;
    max-height: calc(100vh - 53px);
  }
  .sidebar-label{
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--paper-dim);
    padding: 6px 10px 10px;
  }
  .case-tab{
    display:flex; align-items:center; gap:10px;
    padding: 10px 10px;
    margin-bottom: 3px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    cursor:pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  .case-tab:hover{ background: var(--panel); }
  .case-tab.active{ background: var(--panel-alt); border-color: var(--border); }
  .case-seal{
    flex: 0 0 auto;
    width: 26px; height:26px;
    border-radius:50%;
    border: 1.5px solid var(--amber-dim);
    display:flex; align-items:center; justify-content:center;
    font-size: 11px;
    color: var(--amber-dim);
    transition: all .35s cubic-bezier(.4,1.6,.4,1);
    flex-shrink:0;
  }
  .case-tab.solved .case-seal{
    border-color: var(--success);
    color: var(--success);
    background: rgba(127,216,88,.08);
    transform: rotate(360deg);
  }
  .case-meta{ min-width:0; flex:1; }
  .case-file-no{
    font-size: 9px; letter-spacing:.1em; color: var(--paper-dim); text-transform:uppercase;
  }
  .case-title{
    font-size: 12px; color: var(--paper);
    white-space: nowrap; overflow:hidden; text-overflow: ellipsis;
  }
  .case-tab.solved .case-title{ color: var(--success); }
  .case-dots{ font-size:9px; color: var(--amber-dim); letter-spacing:1px; margin-top:2px; }

  /* ---------- MAIN PANEL ---------- */
  #main{
    padding: 28px 32px 80px;
    max-width: 880px;
    width:100%;
  }
  .file-eyebrow{
    font-size: 11px; letter-spacing:.16em; text-transform:uppercase;
    color: var(--amber-dim);
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin-bottom: 6px;
  }
  .tag-chip{
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 9px;
    color: var(--cyan);
    letter-spacing: .08em;
  }
  .dots-chip{ color: var(--amber); letter-spacing:2px; }

  h1.case-heading{
    font-family: var(--serif);
    font-weight: 600;
    font-size: 30px;
    color: var(--paper);
    margin: 0 0 18px;
    line-height:1.25;
  }

  .briefing{
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.75;
    color: var(--paper);
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--amber-dim);
    padding: 18px 22px;
    border-radius: var(--radius);
    margin-bottom: 22px;
    white-space: pre-wrap;
  }

  .puzzle-box{
    background: #0d0e0a;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 18px;
    font-size: 13.5px;
    line-height: 1.85;
    color: var(--amber-bright);
    word-break: break-word;
    white-space: pre-wrap;
  }
  .puzzle-box .label{
    display:block; color: var(--paper-dim); font-size: 10px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:8px;
  }
  .puzzle-box code, .puzzle-box .cipherval{
    color: var(--cyan);
  }

  .decoy-grid{
    display:flex; flex-wrap:wrap; gap: 8px;
  }
  .decoy-tag{
    border:1px solid var(--border-soft);
    background: var(--panel-alt);
    color: var(--paper-dim);
    font-size: 10px;
    padding: 5px 8px;
    border-radius: var(--radius);
  }

  .hints{ margin-bottom: 18px; display:flex; gap:10px; flex-wrap:wrap; }
  .hint-btn{
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--paper-dim);
    padding: 7px 12px;
    font-size: 11px;
    border-radius: var(--radius);
  }
  .hint-btn:hover{ color: var(--cyan); border-color: var(--cyan-dim); }
  .hint-text{
    font-family: var(--serif);
    font-style: italic;
    color: var(--cyan);
    font-size: 13.5px;
    background: rgba(79,209,232,.06);
    border: 1px solid var(--cyan-dim);
    padding: 10px 14px;
    border-radius: var(--radius);
    margin-top: 8px;
    max-width: 100%;
  }

  .submit-row{
    display:flex; gap:10px; align-items:stretch; margin-bottom: 12px; flex-wrap:wrap;
  }
  .prompt-wrap{
    flex:1; min-width: 220px;
    display:flex; align-items:center;
    background: #0d0e0a;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0 12px;
  }
  .prompt-wrap .prefix{ color: var(--success); font-size:13px; white-space:nowrap; margin-right:6px; }
  .prompt-wrap input{
    flex:1; background:transparent; border:none; outline:none;
    color: var(--amber-bright); font-size: 14px; padding: 12px 4px;
    min-width: 0;
  }
  .prompt-wrap input::placeholder{ color: var(--paper-dim); }

  .feedback{
    font-size: 12.5px; margin-bottom: 16px; min-height: 18px;
    letter-spacing:.02em;
  }
  .feedback.ok{ color: var(--success); }
  .feedback.bad{ color: var(--crimson); }

  .dossier-unlock{
    display:none;
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.8;
    color: var(--paper);
    background: linear-gradient(180deg, rgba(127,216,88,.07), rgba(127,216,88,.02));
    border: 1px solid var(--success-dim);
    border-left: 3px solid var(--success);
    padding: 18px 22px;
    border-radius: var(--radius);
    white-space: pre-wrap;
  }
  .dossier-unlock .du-label{
    display:block; font-family: var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color: var(--success); margin-bottom:8px;
  }

  /* terminal widget */
  .term{
    background: #060704;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 13px;
    color: var(--amber);
    height: 260px;
    display:flex; flex-direction:column;
    margin-bottom: 18px;
  }
  .term-out{
    flex:1; overflow-y:auto; white-space: pre-wrap; line-height:1.65; padding-right:4px;
  }
  .term-out .term-cmd{ color: var(--cyan); }
  .term-out .term-err{ color: var(--crimson); }
  .term-line-in{
    display:flex; align-items:center; margin-top:8px; border-top: 1px solid var(--border-soft); padding-top:8px;
  }
  .term-line-in .prefix{ color: var(--success); margin-right:6px; white-space:nowrap; }
  .term-line-in input{
    flex:1; background:transparent; border:none; outline:none; color: var(--amber-bright); font-size:13px;
  }

  /* welcome / finale */
  .welcome-panel{
    font-family: var(--serif);
  }
  .welcome-panel h1{
    font-size: 36px; margin: 0 0 14px; color: var(--paper);
  }
  .welcome-panel p{ font-size: 16px; line-height:1.8; }
  .stat-row{
    display:flex; gap: 30px; margin: 26px 0; flex-wrap:wrap;
  }
  .stat{ font-family: var(--mono); }
  .stat b{ display:block; font-size: 28px; color: var(--amber); }
  .stat span{ font-size: 10px; letter-spacing:.1em; text-transform:uppercase; color: var(--paper-dim); }

  /* toolkit drawer */
  #toolkit-overlay{
    position: fixed; inset:0; background: rgba(0,0,0,.55);
    z-index: 800; display:none;
  }
  #toolkit{
    position: fixed; top:0; right:0; bottom:0;
    width: min(420px, 100vw);
    background: var(--panel);
    border-left: 1px solid var(--border);
    z-index: 801;
    padding: 20px;
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform .25s ease;
  }
  #toolkit.open{ transform: translateX(0); }
  #toolkit-overlay.open{ display:block; }
  .tk-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px; }
  .tk-head h2{ font-size:14px; letter-spacing:.1em; text-transform:uppercase; color: var(--amber); margin:0; }
  .tk-sub{ font-size: 11px; color: var(--paper-dim); margin-bottom: 18px; line-height:1.6; }
  .tk-close{ background:none; border:none; color: var(--paper-dim); font-size: 20px; line-height:1; }
  .tk-tool{
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 12px; background: var(--panel-alt);
  }
  .tk-tool h3{ font-size: 11.5px; letter-spacing:.05em; color: var(--cyan); margin: 0 0 8px; text-transform:uppercase; }
  .tk-tool label{ font-size: 10px; color: var(--paper-dim); display:block; margin: 6px 0 3px; }
  .tk-tool input[type=text], .tk-tool input[type=number], .tk-tool textarea{
    width:100%; background:#0d0e0a; border:1px solid var(--border); color: var(--paper);
    border-radius: var(--radius); padding: 7px 9px; font-size: 12px; resize: vertical;
  }
  .tk-row{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .tk-row .btn{ flex:1; }
  .tk-out{
    margin-top:8px; font-size:12px; color: var(--success); word-break: break-word; min-height:16px;
    background:#0d0e0a; border:1px solid var(--border-soft); border-radius: var(--radius); padding:8px 9px;
  }

  /* responsive */
  @media (max-width: 880px){
    #app{ grid-template-columns: 1fr; }
    #sidebar{
      max-height: none; border-right:none; border-bottom:1px solid var(--border);
      display:flex; overflow-x:auto; overflow-y:hidden; gap:4px; padding: 12px 10px;
    }
    .sidebar-label{ display:none; }
    .case-tab{ flex: 0 0 auto; min-width: 190px; margin-bottom:0; }
    #main{ padding: 22px 16px 60px; }
    h1.case-heading{ font-size: 24px; }
    .topbar-mid{ order:3; width:100%; justify-content:space-between; }
  }

  .visually-hidden-flag{ position:absolute; width:0; height:0; overflow:hidden; }
</style>
</head>

<script>
(function(){
"use strict";

/* ============================================================
   UTILITY: ENCODERS / DECODERS
   ============================================================ */
const Codec = {
  b64encode: s => btoa(unescape(encodeURIComponent(s))),
  b64decode: s => { try { return decodeURIComponent(escape(atob(s.trim()))); } catch(e){ return null; } },
  hexEncode: s => Array.from(s).map(c => c.charCodeAt(0).toString(16).padStart(2,'0')).join(''),
  hexDecode: s => {
    const clean = s.replace(/[^0-9a-fA-F]/g,'');
    if(clean.length % 2 !== 0) return null;
    let out = '';
    for(let i=0;i<clean.length;i+=2){ out += String.fromCharCode(parseInt(clean.substr(i,2),16)); }
    return out;
  },
  rot13: s => s.replace(/[a-zA-Z]/g, c => {
    const base = c <= 'Z' ? 65 : 97;
    return String.fromCharCode((c.charCodeAt(0)-base+13)%26+base);
  }),
  caesar: (s, shift) => s.replace(/[a-zA-Z]/g, c => {
    const base = c <= 'Z' ? 65 : 97;
    const sh = ((shift % 26) + 26) % 26;
    return String.fromCharCode((c.charCodeAt(0)-base+sh)%26+base);
  }),
  toBinary: s => Array.from(s).map(c => c.charCodeAt(0).toString(2).padStart(8,'0')).join(' '),
  fromBinary: s => {
    const groups = s.trim().split(/\s+/).filter(Boolean);
    try { return groups.map(g => String.fromCharCode(parseInt(g,2))).join(''); } catch(e){ return null; }
  },
  morseTable: {a:'.-',b:'-...',c:'-.-.',d:'-..',e:'.',f:'..-.',g:'--.',h:'....',i:'..',j:'.---',k:'-.-',l:'.-..',m:'--',n:'-.',o:'---',p:'.--.',q:'--.-',r:'.-.',s:'...',t:'-',u:'..-',v:'...-',w:'.--',x:'-..-',y:'-.--',z:'--..','_':'..--.-'},
  toMorse: s => Array.from(s.toLowerCase()).map(c => Codec.morseTable[c] || c).join(' '),
  fromMorse: s => {
    const rev = {};
    Object.keys(Codec.morseTable).forEach(k => rev[Codec.morseTable[k]] = k);
    return s.trim().split(/\s+/).map(g => rev[g] !== undefined ? rev[g] : '?').join('');
  },
  xorSingle: (bytesOrText, key, inputIsBytes) => {
    let bytes;
    if(inputIsBytes){
      bytes = bytesOrText.split(',').map(x => parseInt(x.trim(),10));
    } else {
      bytes = Array.from(bytesOrText).map(c => c.charCodeAt(0));
    }
    return bytes.map(b => b ^ (key & 0xFF));
  },
  xorRepeating: (bytesCsv, keyText) => {
    const bytes = bytesCsv.split(',').map(x => parseInt(x.trim(),10));
    return bytes.map((b,i) => b ^ keyText.charCodeAt(i % keyText.length));
  },
  bytesToText: arr => arr.map(n => String.fromCharCode(((n % 256)+256)%256)).join(''),
};

async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

/* ============================================================
   CHALLENGE DATA
   ============================================================ */
const CASES = [
{
  id:1, title:"First Contact", category:"SOURCE", diff:1,
  briefing:"An anonymous message reached you an hour ago: coordinates, a login page, nothing else. The Handler said the first door is never really locked — you just have to know how to look behind it.\n\nRight-click this panel and choose Inspect. Somewhere in the markup, someone left a note.",
  hints:[
    "Web pages carry more than what's rendered on screen. Developer tools let you read the raw structure underneath.",
    "Open DevTools (F12, or right-click → Inspect) and look through the Elements panel for an HTML comment inside this panel."
  ],
  render: () => `<div class="puzzle-box"><span class="label">Panel contents</span>Nothing appears to be visible here. That doesn't mean nothing is here.<!-- CASE FILE 01: BIOBI{ghost_in_the_wire} --></div>`,
  unlock: "TRANSMISSION — THE HANDLER: 'Good, you found it. That's lesson one: BIOBI builds beautiful front doors and leaves the back ones held together with comments and good intentions. There will be twenty-one more doors. Some are behind code. Some are behind people. Find them all, and you'll understand what Wraith really is.'",
  answerHash:"48c99430d5023b1bfa8bbf046544136dffac2ad44138dbc8f00ae4894c683d9f"

/* ============================================================
   TERMINAL ENGINE
   ============================================================ */
const termState = {}; // id -> { path: [], history: [] }

function fsGetNode(fs, path){
  let node = fs;
  for(const seg of path){
    if(!node.children || !node.children[seg]) return null;
    node = node.children[seg];
  }
  return node;
}

function doGrep(args, caseObj, cwdNode){
  if(args.length < 2) return "usage: grep <term> <file|*>";
  const term = args[0].toLowerCase();
  const target = args[1];
  let results = [];
  const searchFile = (name, node) => {
    if(node.type === 'file'){
      node.content.split('\n').forEach(line => {
        if(line.toLowerCase().includes(term)) results.push(`${name}: ${line}`);
      });
    }
  };
  if(target === '*'){
    Object.keys(cwdNode.children || {}).forEach(name => {
      const n = cwdNode.children[name];
      if(n.type === 'file') searchFile(name, n);
    });
  } else {
    const n = cwdNode.children && cwdNode.children[target];
    if(!n) return `grep: ${target}: No such file`;
    searchFile(target, n);
  }
  return results.length ? results.join('\n') : "(no matches)";
}

function doSSH(args){
  if(args.join(' ') !== 'biobi-core'){
    return "ssh: could not resolve host — try: ssh biobi-core";
  }
  return "Connecting to biobi-core...\nSession resumed — stale credentials still valid.\nWelcome, ghost.\n\nMOTD (base64):\nZmluYWxfYWNjZXNzX2tleQ==\n\nDecode the MOTD to recover the access phrase.";
}

function renderTerminal(caseId){
  termState[caseId] = { path: [] };
  return `
  <div class="term" id="term-${caseId}">
    <div class="term-out" id="term-out-${caseId}">BIOBI DIAGNOSTIC SHELL — type 'help' to begin\n</div>
    <div class="term-line-in">
      <span class="prefix">$</span>
      <input type="text" id="term-in-${caseId}" autocomplete="off" spellcheck="false" placeholder="type a command..." />
    </div>
  </div>`;
}

function wireTerminal(caseObj){
  const id = caseObj.id;
  const input = document.getElementById(`term-in-${id}`);
  const out = document.getElementById(`term-out-${id}`);
  if(!input) return;
  input.addEventListener('keydown', (e) => {
    if(e.key !== 'Enter') return;
    const raw = input.value;
    input.value = '';
    const args = raw.trim().split(/\s+/).filter(Boolean);
    const cmd = (args[0]||'').toLowerCase();
    const rest = args.slice(1);
    const st = termState[id];
    const cwdNode = fsGetNode(caseObj.terminalFS, st.path) || caseObj.terminalFS;
    let response = '';

    if(cmd === ''){ /* noop */ }
    else if(cmd === 'help'){
      response = "commands: ls, cd <dir>, cat <file>, pwd" + (caseObj.customCommands ? ", " + Object.keys(caseObj.customCommands).join(', ') : '');
    } else if(cmd === 'pwd'){
      response = '/' + st.path.join('/');
    } else if(cmd === 'ls'){
      const names = Object.keys(cwdNode.children || {});
      response = names.length ? names.map(n => cwdNode.children[n].type === 'dir' ? n + '/' : n).join('  ') : '(empty)';
    } else if(cmd === 'cd'){
      if(rest[0] === '..'){ st.path.pop(); response = '/' + st.path.join('/'); }
      else if(!rest[0]){ response = '/' + st.path.join('/'); }
      else {
        const target = cwdNode.children && cwdNode.children[rest[0]];
        if(target && target.type === 'dir'){ st.path.push(rest[0]); response = '/' + st.path.join('/'); }
        else { response = `cd: ${rest[0]}: No such directory`; }
      }
    } else if(cmd === 'cat'){
      const target = cwdNode.children && cwdNode.children[rest[0]];
      if(target && target.type === 'file'){ response = target.content; }
      else { response = `cat: ${rest[0] || ''}: No such file`; }
    } else if(caseObj.customCommands && caseObj.customCommands[cmd]){
      response = caseObj.customCommands[cmd](rest, caseObj, cwdNode);
    } else {
      response = `command not found: ${cmd} — try 'help'`;
    }

    const cmdLine = `<span class="term-cmd">$ ${escapeHtml(raw)}</span>`;
    const respLine = response ? escapeHtml(response) : '';
    out.innerHTML += `\n${cmdLine}\n${respLine}`;
    out.scrollTop = out.scrollHeight;
  });
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ============================================================
   STATE / PROGRESS
   ============================================================ */
const state = {
  captured: new Set(),
  activeCase: 1,
  hintsRevealed: {} // caseId -> count revealed
};

function encodeProgress(){
  let bits = 0n;
  state.captured.forEach(id => { bits |= (1n << BigInt(id-1)); });
  let sum = 0;
  state.captured.forEach(id => sum += id);
  const checksum = sum % 97;
  const code = bits.toString(36).toUpperCase() + '-' + checksum.toString(36).toUpperCase();
  return 'BB-' + code;
}

function decodeProgress(code){
  try{
    const clean = code.trim().toUpperCase().replace(/^BB-/,'');
    const [bitsPart, checkPart] = clean.split('-');
    if(!bitsPart || !checkPart) return false;
    const bits = BigInt('0x' + BigInt(parseInt(bitsPart,36)).toString(16));
    // rebuild properly using base36 parse
    const bitsVal = BigInt(parseBase36(bitsPart));
    const expectedCheck = parseInt(checkPart,36);
    const ids = [];
    for(let i=0;i<22;i++){
      if((bitsVal >> BigInt(i)) & 1n){ ids.push(i+1); }
    }
    const sum = ids.reduce((a,b)=>a+b,0);
    if((sum % 97) !== expectedCheck) return false;
    state.captured = new Set(ids);
    return true;
  } catch(e){ return false; }
}

function parseBase36(str){
  let val = 0n;
  const digits = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for(const ch of str){
    const d = digits.indexOf(ch);
    if(d < 0) throw new Error('bad char');
    val = val * 36n + BigInt(d);
  }
  return val;
}

/* ============================================================
   RENDERING: SIDEBAR
   ============================================================ */
function renderSidebar(){
  const list = document.getElementById('case-list');
  list.innerHTML = CASES.map(c => {
    const solved = state.captured.has(c.id);
    const dots = '●'.repeat(c.diff) + '○'.repeat(5-c.diff);
    return `
    <div class="case-tab ${solved?'solved':''} ${state.activeCase===c.id?'active':''}" data-case="${c.id}" tabindex="0" role="button" aria-label="File ${String(c.id).padStart(2,'0')}: ${c.title}${solved?' (recovered)':''}">
      <div class="case-seal">${solved ? '✓' : '?'}</div>
      <div class="case-meta">
        <div class="case-file-no">File №${String(c.id).padStart(2,'0')} · ${c.category}</div>
        <div class="case-title">${c.title}</div>
        <div class="case-dots">${dots}</div>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.case-tab').forEach(tab => {
    const open = () => { state.activeCase = parseInt(tab.dataset.case,10); renderAll(); };
    tab.addEventListener('click', open);
    tab.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } });
  });
}

/* ============================================================
   RENDERING: MAIN PANEL
   ============================================================ */
function renderMain(){
  const main = document.getElementById('main');
  const c = CASES.find(x => x.id === state.activeCase);
  if(!c){ main.innerHTML = ''; return; }
  const solved = state.captured.has(c.id);
  const dots = '●'.repeat(c.diff) + '○'.repeat(5-c.diff);
  const hintsCount = state.hintsRevealed[c.id] || 0;

  main.innerHTML = `
    <div class="file-eyebrow">
      <span>FILE №${String(c.id).padStart(2,'0')}</span>
      <span class="tag-chip">${c.category}</span>
      <span class="dots-chip">${dots}</span>
    </div>
    <h1 class="case-heading">${c.title}</h1>
    <div class="briefing">${c.briefing}</div>
    <div id="puzzle-render">${c.render()}</div>
    <div class="hints" id="hints-${c.id}">
      ${c.hints.map((h,i) => i < hintsCount ? '' : `<button class="hint-btn" data-hint="${i}">Reveal Hint ${i+1}</button>`).join('')}
    </div>
    <div id="hint-texts-${c.id}">
      ${c.hints.slice(0,hintsCount).map(h => `<div class="hint-text">${h}</div>`).join('')}
    </div>
    <div class="submit-row">
      <div class="prompt-wrap">
        <span class="prefix">biobi@wraith:~$ submit</span>
        <input type="text" id="flag-input" placeholder="BIOBI{...}" ${solved?'disabled':''} value="${solved?'✓ captured':''}" />
      </div>
      <button class="btn primary" id="submit-btn" ${solved?'disabled':''}>${solved?'Recovered':'Verify'}</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="dossier-unlock" id="dossier" style="${solved?'display:block':''}">
      <span class="du-label">Dossier Entry Unlocked</span>${c.unlock}
    </div>
  `;

  if(c.category === 'TERMINAL'){ wireTerminal(c); }
  if(c.category === 'CONSOLE'){ /* render() already logged to console */ }

  main.querySelectorAll('.hint-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.hint,10);
      state.hintsRevealed[c.id] = Math.max(state.hintsRevealed[c.id]||0, idx+1);
      renderMain();
    });
  });

  const submitBtn = document.getElementById('submit-btn');
  const flagInput = document.getElementById('flag-input');
  if(!solved){
    const attempt = () => checkFlag(c, flagInput.value);
    submitBtn.addEventListener('click', attempt);
    flagInput.addEventListener('keydown', e => { if(e.key === 'Enter') attempt(); });
  }
}

async function checkFlag(c, value){
  const feedback = document.getElementById('feedback');
  const cleaned = (value || '').trim().toLowerCase();
  if(!cleaned){ feedback.textContent = 'Enter a flag before verifying.'; feedback.className = 'feedback bad'; return; }
  const hash = await sha256Hex(cleaned);
  if(hash === c.answerHash){
    state.captured.add(c.id);
    feedback.textContent = 'ACCESS GRANTED — evidence logged.';
    feedback.className = 'feedback ok';
    renderSidebar();
    renderMain();
    updateProgress();
    if(state.captured.size === CASES.length){ setTimeout(showFinale, 600); }
  } else {
    feedback.textContent = 'ACCESS DENIED — that phrase does not match this file.';
    feedback.className = 'feedback bad';
  }
}

function updateProgress(){
  document.getElementById('progress-display').textContent = `${state.captured.size} / ${CASES.length}`;
}

function showFinale(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="welcome-panel">
      <div class="file-eyebrow"><span class="tag-chip">CASE STATUS: CLOSED</span></div>
      <h1>All 22 files recovered.</h1>
      <p>You pulled every thread The Handler pointed you toward, and a few they didn't. Project Wraith is exposed. BIOBI has a great deal to answer for, and — for the first time in this entire investigation — so does the world that now knows what to ask.</p>
      <div class="stat-row">
        <div class="stat"><b>22 / 22</b><span>Files Recovered</span></div>
        <div class="stat"><b>${sumHintsUsed()}</b><span>Hints Used</span></div>
      </div>
      <p style="color:var(--paper-dim); font-size:14px;">Case file BB-WRAITH is now closed. Thank you for running the investigation. Go dark.</p>
    </div>
  `;
}

function sumHintsUsed(){
  return Object.values(state.hintsRevealed).reduce((a,b)=>a+b,0);
}

function renderAll(){
  renderSidebar();
  renderMain();
  updateProgress();
}

    <div class="tk-tool">
      <h3>XOR — Single Numeric Key</h3>

function openToolkit(){ document.getElementById('toolkit').classList.add('open'); document.getElementById('toolkit-overlay').classList.add('open'); }
function closeToolkit(){ document.getElementById('toolkit').classList.remove('open'); document.getElementById('toolkit-overlay').classList.remove('open'); }

/* ============================================================
   DEAL CLOCK (cosmetic countdown)
   ============================================================ */
function startClock(){
  let totalSeconds = 2*3600 + 59*60 + 59;
  const display = document.getElementById('clock-display');
  setInterval(() => {
    if(totalSeconds > 0) totalSeconds--;
    const h = Math.floor(totalSeconds/3600).toString().padStart(2,'0');
    const m = Math.floor((totalSeconds%3600)/60).toString().padStart(2,'0');
    const s = Math.floor(totalSeconds%60).toString().padStart(2,'0');
    display.textContent = `${h}:${m}:${s}`;
  }, 1000);
}

/* ============================================================
   BOOT SEQUENCE
   ============================================================ */
const bootScript = [
  "BIOBI SECURE RELAY — connecting...",
  "...",
  "connection established via 4 relays. origin masked.",
  "",
  "you don't know who The Handler is. that's the point.",
  "the message was three lines long:",
  "",
  "  'BIOBI is not what they sell you.",
  "   there's a program inside their systems called Wraith.",
  "   twenty-two pieces of evidence exist. find them. bring them into the light.'",
  "",
  "no name. no return address. just a login, and a warning:",
  "  this terminal will not remember you if you close it.",
  "  before you finish, write down your resume code.",
  "",
  "case file BB-WRAITH is now open.",
  ""
];

function runBoot(){
  const el = document.getElementById('boot-lines');
  const enter = document.getElementById('boot-enter');
  let i = 0, text = '';
  function typeLine(){
    if(i >= bootScript.length){
      enter.style.display = 'block';
      return;
    }
    const line = bootScript[i];
    let j = 0;
    const speed = line.length === 0 ? 0 : 10;
    function typeChar(){
      if(j <= line.length){
        el.innerHTML = text + line.slice(0,j) + '<span class="boot-cursor"></span>';
        j++;
        setTimeout(typeChar, speed);
      } else {
        text += line + '\n';
        i++;
        setTimeout(typeLine, 90);
      }
    }
    typeChar();
  }
  typeLine();
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  buildToolkit();
  document.getElementById('toolkit-btn').addEventListener('click', openToolkit);
  document.getElementById('tk-close-btn').addEventListener('click', closeToolkit);
  document.getElementById('toolkit-overlay').addEventListener('click', closeToolkit);

  document.getElementById('save-code-btn').addEventListener('click', () => {
    const code = encodeProgress();
    prompt('Your resume code — copy this somewhere safe. Paste it back in via "Resume Code" on the boot screen (reload the page) to restore progress:', code);
  });

  document.getElementById('boot-begin-btn').addEventListener('click', () => {
    document.getElementById('boot').style.display = 'none';
    document.getElementById('app').style.display = 'grid';
    startClock();
    renderAll();
  });

  document.getElementById('boot-resume-link').addEventListener('click', () => {
    const code = prompt('Enter your resume code:');
    if(code){
      const ok = decodeProgress(code);
      if(!ok){ alert('That code could not be verified. Starting fresh.'); state.captured = new Set(); }
    }
    document.getElementById('boot').style.display = 'none';
    document.getElementById('app').style.display = 'grid';
    startClock();
    renderAll();
  });

  runBoot();
}

document.addEventListener('DOMContentLoaded', init);
})();
